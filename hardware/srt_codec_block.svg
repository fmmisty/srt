<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="'Yu Gothic','Meiryo',sans-serif">
  <rect x="0" y="0" width="1280" height="800" fill="#ffffff"/>
  <text x="640" y="34" font-size="23" font-weight="bold" text-anchor="middle" fill="#1f4e79">RFD SRT音声コーデック (1U・Raspberry Pi 4 内蔵) 内部構成図</text>
  <text x="640" y="58" font-size="13" text-anchor="middle" fill="#666">バランスアナログ＋AES/EBU / UAC2(ドライバ不要) / 携帯WEBでコーデック無停止切替 / 全二重(送受同時)</text>

  <!-- 背面I/O -->
  <rect x="22" y="86" width="210" height="560" rx="10" fill="#f2f6fb" stroke="#1f4e79"/>
  <text x="127" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f4e79">背面パネル I/O</text>
  <g font-size="12.5" fill="#111">
    <rect x="40" y="124" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="142">AES IN (XLR-F 110Ω)</text>
    <rect x="40" y="158" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="176">AES OUT (XLR-M 110Ω)</text>
    <rect x="40" y="192" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="210">ANALOG IN L/R (XLR-F)</text>
    <rect x="40" y="226" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="244">ANALOG OUT L/R (XLR-M)</text>
    <rect x="40" y="278" width="174" height="28" rx="5" fill="#e8f4ea" stroke="#2e8b57"/><text x="49" y="296">LAN (RJ-45) SRT/WEB</text>
    <rect x="40" y="312" width="174" height="28" rx="5" fill="#e8f4ea" stroke="#2e8b57"/><text x="49" y="330">Wi-Fi RF窓(樹脂カバー) →スマホ</text>
    <rect x="40" y="346" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="364">USB-C (保守用)</text>
    <rect x="40" y="398" width="174" height="28" rx="5" fill="#fff" stroke="#888"/><text x="49" y="416">AC IN (100-240V)</text>
    <rect x="40" y="600" width="174" height="30" rx="5" fill="#f7f7f7" stroke="#bbb"/><text x="49" y="619" fill="#999">REMOTE/GPIO: 無し</text>
  </g>

  <!-- USBオーディオ フロントエンド -->
  <rect x="262" y="86" width="420" height="470" rx="10" fill="#fbf7ea" stroke="#b7950b"/>
  <text x="472" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#8a6d0b">USBオーディオ・フロントエンド基板 (UAC2)</text>
  <g font-size="12" fill="#111">
    <rect x="280" y="122" width="150" height="42" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="140">入力ラインレシーバ+LPF</text><text x="289" y="157" font-size="10.5" fill="#666">THAT1246</text>
    <rect x="280" y="170" width="150" height="42" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="188">ADC 2ch</text><text x="289" y="205" font-size="10.5" fill="#666">PCM1862 (24bit)</text>
    <rect x="280" y="218" width="150" height="42" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="236">DAC 2ch</text><text x="289" y="253" font-size="10.5" fill="#666">PCM5242 (24bit)</text>
    <rect x="280" y="266" width="150" height="42" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="284">出力ラインドライバ</text><text x="289" y="301" font-size="10.5" fill="#666">THAT1646 (±15V,+4dBu)</text>
    <rect x="280" y="314" width="150" height="54" rx="6" fill="#fff5f5" stroke="#c0392b"/><text x="289" y="332">AES 送受+ASRC</text><text x="289" y="349" font-size="10.5" fill="#666">SRC4392</text><text x="289" y="363" font-size="10.5" fill="#666">RX/TX/デュアルASRC</text>
    <rect x="280" y="374" width="150" height="36" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="396">クロック 24.576/22.5792M</text>
    <rect x="280" y="416" width="150" height="30" rx="6" fill="#fff" stroke="#b7950b"/><text x="289" y="436" font-size="11">110Ω AESパルストランス</text>

    <rect x="472" y="150" width="192" height="270" rx="8" fill="#fff8e1" stroke="#b7950b" stroke-width="2"/>
    <text x="568" y="175" font-size="13" font-weight="bold" text-anchor="middle" fill="#8a6d0b">UAC2 USBブリッジ</text>
    <text x="568" y="196" font-size="12" text-anchor="middle" fill="#111">XMOS XU316</text>
    <text x="568" y="230" font-size="11" text-anchor="middle" fill="#444">I2S ← ADC / → DAC</text>
    <text x="568" y="250" font-size="11" text-anchor="middle" fill="#444">SPDIF ↔ SRC4392(AES)</text>
    <text x="568" y="280" font-size="11" text-anchor="middle" fill="#444">USB Audio Class 2.0</text>
    <text x="568" y="300" font-size="11" text-anchor="middle" fill="#444">4in / 4out</text>
    <text x="568" y="320" font-size="11" text-anchor="middle" fill="#444">(analog L/R + AES L/R)</text>
    <text x="568" y="352" font-size="10.5" text-anchor="middle" fill="#888">ドライバ不要でPi認識</text>
  </g>
  <g stroke="#b7950b" stroke-width="1.5" fill="none">
    <path d="M430 191 H472"/><path d="M430 239 H472"/><path d="M430 293 H472"/><path d="M430 341 H472"/>
  </g>

  <!-- Raspberry Pi 内蔵 -->
  <rect x="742" y="86" width="380" height="470" rx="10" fill="#eaf7ee" stroke="#2e8b57" stroke-width="2"/>
  <text x="932" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e6b3f">Raspberry Pi 4 (内蔵・2GB・Wi-Fi)</text>
  <g font-size="12.5" fill="#111">
    <rect x="762" y="126" width="340" height="60" rx="6" fill="#fff" stroke="#2e8b57"/>
      <text x="774" y="148">srt_send + srt_recv (全二重)</text>
      <text x="774" y="168" font-size="11" fill="#555">5コーデック / 無停止切替 / SRT ARQ・latency</text>
    <rect x="762" y="194" width="340" height="40" rx="6" fill="#fff" stroke="#2e8b57"/><text x="774" y="219">codec_web.py (携帯WEB: 選択+現在表示)</text>
    <rect x="762" y="242" width="340" height="34" rx="6" fill="#fff" stroke="#2e8b57"/><text x="774" y="264">ALSA (arecord / aplay ・ UAC2 4ch)</text>
    <rect x="762" y="296" width="165" height="40" rx="6" fill="#fff" stroke="#2e8b57"/><text x="774" y="321">Ethernet → LAN</text>
    <rect x="937" y="296" width="165" height="40" rx="6" fill="#fff" stroke="#2e8b57"/><text x="949" y="315" font-size="11">USB Wi-Fi子機</text><text x="949" y="330" font-size="11">→ RF窓 →スマホ</text>
    <rect x="762" y="346" width="340" height="34" rx="6" fill="#fff" stroke="#2e8b57"/><text x="774" y="368">USB(内部) ← フロントエンドの音声(4ch)</text>
    <rect x="762" y="392" width="340" height="30" rx="6" fill="#eef7f0" stroke="#2e8b57"/><text x="774" y="412" font-size="11" fill="#555">冷却: 非密閉/前面吸気→背面静音ファン・SoCヒートシンク筐体結合・温度PWM</text>
  </g>

  <defs><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#333"/></marker></defs>
  <!-- I/O to frontend -->
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M214 138 H255 V150 L280 335"/>       <!-- AES IN -> SRC4392(approx) -->
    <path d="M280 341 H250 V172 H214"/>          <!-- AES OUT -->
    <path d="M214 206 H280"/>                    <!-- ANALOG IN -> receiver -->
    <path d="M280 287 H240 V240 H214"/>          <!-- OUT driver -> ANALOG OUT -->
  </g>
  <!-- UAC2 -> Pi internal USB -->
  <path d="M664 300 H742" stroke="#333" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="703" y="292" font-size="11" font-weight="bold" text-anchor="middle" fill="#333">内部USB</text>
  <!-- LAN -->
  <path d="M762 316 H700 V292 H214" stroke="#2e8b57" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <!-- WiFi -->
  <path d="M1020 296 V270 H700 V326 H214" stroke="#2e8b57" stroke-width="1.6" fill="none" stroke-dasharray="5" marker-end="url(#ar)"/>

  <!-- 電源 -->
  <rect x="262" y="566" width="860" height="120" rx="10" fill="#f5f5f5" stroke="#666"/>
  <text x="692" y="590" font-size="14" font-weight="bold" text-anchor="middle" fill="#333">内部電源 (AC-DC, 25〜35W級)</text>
  <g font-size="12" fill="#111">
    <text x="282" y="614">AC IN → +5V/4A(内蔵Pi) ・ +3.3V(デジタル) ・ +0.9V(XU316コア)</text>
    <text x="282" y="636">・ アナログ+3.3V(クリーンLDO: ADC/DAC) ・ ±15V(THAT1646/入力: +4dBu / 最大~+22dBu)</text>
    <text x="282" y="658" fill="#666">接地: /PE分離・シャーシGND(御社 電源基板方式)。クロックは別LDOで分離</text>
    <text x="282" y="678" fill="#666">レベル: 公称+4dBu / 0dBFS≒+22dBu(≒18dBヘッドルーム) / 24bit</text>
  </g>
  <g stroke="#333" stroke-width="2" fill="none" marker-end="url(#ar)">
    <path d="M214 412 H472 V566"/>   <!-- AC IN -> PSU -->
  </g>

  <text x="640" y="762" font-size="11.5" text-anchor="middle" fill="#888">確定: Pi内蔵/全二重 ・ AES=SRC4392(ASRC) ・ ±15V(+4dBu) ・ 24bit処理/SRT伝送S16 ・ Wi-Fi=USB子機+RF窓(樹脂カバー) ・ 冷却=非密閉/背面静音ファン ・ REMOTE無し ｜ 未定: 量産構成(Pi4B or CM4)</text>
</svg>
